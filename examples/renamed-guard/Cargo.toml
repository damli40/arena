[package]
name = "renamed_guard"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.27"

[dev-dependencies]
near-sdk = { version = "5.27", features = ["unit-testing"] }

[workspace]
resolver = "3"
members = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
