# Copy this file to .github/workflows/arena-check.yml in YOUR guard's repo.
# It builds your guard, runs Arena's attack library against it on a local NEAR sandbox inside
# the runner, and puts the result in the job summary and a downloadable report.
#
# Replace the three marked lines: ARENA_OWNER (where Arena lives on GitHub), ARENA_COMMIT (a full
# 40-character commit SHA of Arena; pin a SHA, not a branch), and your build command + wasm path.
name: arena check

# pull_request, NEVER pull_request_target: pull_request_target runs the PR's code with the base
# repo's secrets and a write token, so a stranger's PR could steal them.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: the check reads your code and writes nothing back to the repo.
permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1. Build your guard. Arena needs the .wasm file, nothing else from your repo.
      - name: Build the guard
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown            # <- your build command

      # 2. Run Arena against it.
      - name: Arena check
        uses: ARENA_OWNER/arena@ARENA_COMMIT                                  # <- pin a full commit SHA
        with:
          wasm: target/wasm32-unknown-unknown/release/my_guard.wasm          # <- your wasm
          # config: arena/guard.json        # only if your init args differ from Arena's interface
          # mapping: arena/mapping.json     # only if your method names differ
          fail-on: beyond-policy            # or against-intent, or never
          # muse-api-key: ${{ secrets.MUSE_API_KEY }}  # optional: lets Muse PROPOSE a mapping.
          #   Secrets are not given to pull requests from forks, so commit a mapping.json instead
          #   if outside contributors open PRs.

# Optional: comment the result on the pull request. Off by default. To turn it on:
