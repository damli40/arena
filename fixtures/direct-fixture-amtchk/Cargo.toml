[package]
name = "direct-fixture-amtchk"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

# Standalone on purpose: not a member of contracts/ so building it never touches the
# contracts workspace (and the wasm hashes the existing results depend on).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
