[package]
name = "guard-proofs"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: never a member of contracts/ or harness/.
[workspace]

[dependencies]
# The hand-written model, checked in lockstep against the real contract.
guard-model = { path = "../guard-model" }
# The must-fail mutant (one line deleted), used only with --features mutant.
guard-mutant = { path = "../guard-real-mutant" }
# The pre-2026-11-11 reconcile arm put back (must-fail), used only with --features mutant-reopen.
guard-mutant-reopen = { path = "../guard-real-mutant-reopen" }
# The REAL guard source, compiled unchanged from contracts/guard.
guard = { path = "../../contracts/guard" }
# The shared property library (plain Rust): src/bin/properties.rs checks no-double-pay with it.
arena-properties = { path = "../properties" }
# Same near-sdk the guard's wasm was built with (contracts/Cargo.lock: 5.27.0),
# plus its mocked blockchain for running contract methods natively.
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }
# The fee table the mocked chain needs (same version near-sdk 5.27.0 pulls in).
near-parameters = "=0.35.1"

[features]
mutant = []
mutant-reopen = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
