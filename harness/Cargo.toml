[package]
name = "arena-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
near-workspaces = { version = "0.24" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
sha2 = "0.10"
# Extended direct mode: Arena signs payments for guards that check an off-chain signature (direct_ext.rs).
near-crypto = "0.38"
base64 = "0.22"
# same crate and sandbox binary near-workspaces already uses; lets a window proof start its sandbox
# with a longer block-production limit (see direct_ext::sandbox)
near-sandbox = "0.4.0"

[profile.release]
debug = false
