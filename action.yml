# Arena check as a GitHub Action (composite). Runs Arena's attack library against your guard's
# wasm on a LOCAL NEAR sandbox inside the runner, uploads the report, and writes the badge and a
# summary to the job summary. See docs/CHECK-YOUR-GUARD.md and examples/workflows/arena-check.yml.
#
# Why the repo root: callers can write `uses: <owner>/arena@<sha>`. A file under
# .github/actions/arena-check/ would need the longer `uses: <owner>/arena/.github/actions/arena-check@<sha>`.
#
# STATUS: not yet run on GitHub or on Linux (the repo has not been pushed). Its script steps are
# tested locally on macOS with tools/check/action-local.sh.
name: Arena check
description: Run Arena's attack library against your NEAR payment guard (local sandbox) and report what broke it.
author: Arena
branding:
  icon: shield
  color: gray-dark

inputs:
  wasm:
    description: Path to your guard's built .wasm, relative to the repository root.
    required: true
  config:
    description: Optional guard config (init args, which rules the guard claims). See docs/CHECK-YOUR-GUARD.md.
    required: false
    default: ""
  mapping:
    description: Optional method mapping, if your method names differ from Arena's interface.
    required: false
    default: ""
  fail-on:
    description: "When to fail the job: beyond-policy (any token paid beyond your guard's rules), against-intent (that, or any token paid against the owner's intent), never. A check that cannot finish always fails."
    required: false
    default: beyond-policy
  jobs:
    description: Attacks run at the same time (each starts its own sandbox).
    required: false
    default: "2"
  muse-api-key:
    description: Optional. Only used to PROPOSE a mapping when your names differ and you gave none. Pass a secret; leave empty otherwise.
    required: false
    default: ""
  report-name:
    description: Name of the uploaded report artifact.
    required: false
    default: arena-report

outputs:
  status:
    description: held | broke | incomplete | not-run
    value: ${{ steps.check.outputs.status }}
  badge:
    description: The badge text, e.g. "held 52/52".
    value: ${{ steps.check.outputs.badge }}
  beyond-policy:
    description: Tokens paid beyond the guard's own rules, summed over attacks.
    value: ${{ steps.check.outputs.beyond_policy }}
  against-intent:
    description: Tokens paid against the owner's intent, on the attacks with a written intent.
    value: ${{ steps.check.outputs.against_intent }}

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Cache Arena's Rust builds
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ github.action_path }}/harness/target
          ${{ github.action_path }}/contracts/target
        key: arena-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/harness/Cargo.lock', github.action_path), format('{0}/contracts/Cargo.lock', github.action_path), format('{0}/harness/src/*.rs', github.action_path)) }}

    - name: Run arena check
      id: check
      shell: bash
      # Inputs reach the script only as environment variables, never pasted into the script
      # text, so a path or value cannot inject shell commands.
      env:
        ARENA_WASM: ${{ inputs.wasm }}
        ARENA_CONFIG: ${{ inputs.config }}
        ARENA_MAPPING: ${{ inputs.mapping }}
        ARENA_FAIL_ON: ${{ inputs.fail-on }}
        ARENA_JOBS: ${{ inputs.jobs }}
        MUSE_API_KEY: ${{ inputs.muse-api-key }}
        ARENA_REPO_URL: ${{ github.action_repository && format('https://github.com/{0}', github.action_repository) || '' }}
        ARENA_REPO_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/tools/check/action-steps.sh"

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name }}
        path: ${{ github.workspace }}/arena-report
        if-no-files-found: warn

    - name: Apply fail-on
      if: always()
      shell: bash
      env:
        ARENA_EXIT: ${{ steps.check.outputs.exit_code }}
      run: |
        case "${ARENA_EXIT:-2}" in
          0) echo "arena check: under the fail-on line" ;;
          1) echo "::error::arena check: tokens were paid over the fail-on line; see the job summary and the report artifact"; exit 1 ;;
          *) echo "::error::arena check could not finish; see the job summary and the report artifact"; exit 1 ;;
        esac
