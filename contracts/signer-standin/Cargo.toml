[package]
name = "signer-standin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.27.0"
borsh = "=1.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Its own workspace: not a member of contracts/Cargo.toml, so the test token's build and lock
# file are untouched by this crate.
[workspace]
resolver = "3"
members = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
