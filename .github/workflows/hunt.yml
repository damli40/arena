# Daily hunt: a model reads recent security papers and recent hack news (Elfa AI summaries of posts on
# X/Telegram), proposes attacks as data, and the bench runs them on a LOCAL sandbox (inside this
# runner) against every opt-in guard in guards/registry.json.
#
# Which model, per job (chosen by the 2026-11-11 quality gate, evidence/nearai-2026-11-11.md):
#   papers: z-ai/glm-5.3-flash on NEAR AI Cloud private inference. Before its first call the hunt
#           fetches NEAR's attestation report (fresh nonce), checks it, and saves it with its sha256 in
#           the hunt record; every reply's NEAR signature is checked against the attested model key.
#           The Intel quote is checked with dcap-qvl (pinned, installed by ci-steps.sh build).
#   news:   Meta Muse Spark (no attestation). The attested model's news replies failed the
#           validator more often, so news stays on Muse. ARENA_NEWS_MODEL_PROVIDER=nearai switches it.
# The scoring is plain code on the local sandbox; the attestation says which model wrote the
# attacks, not whether they are good or whether a guard result is right.
#
# Results leave as a workflow ARTIFACT only. This job never pushes. Why not commit to a
# hunt-results branch: that needs `contents: write`, and this job feeds untrusted text (paper
# abstracts, model output) through a pipeline. Nothing in it is executed, but a write token in the
# same job is the one thing that would turn a future slip into a repo change. With read-only
# permissions, the worst a slip can do is spoil one artifact. To publish results, download the
# artifact and commit it by hand (or add a separate job that only reads the artifact).
#
# The used list (papers and news post links) survives between runs through actions/cache, so a
# paper or news item is not re-attacked every day even though nothing is committed.
#
# Secrets come from the GitHub Environment named `hunt` (job setting `environment: hunt` below), not from
# repository secrets, so the owner can limit which branch may use them (main only) and remove them in one place.
# Environment secrets: NEARAI_API_KEY (papers), MUSE_API_KEY (news; without it the news source is
# skipped with a log line and the paper hunt still runs), ELFA_API_KEY (optional: without it the news
# source is skipped too). Each news hunt makes at most 2 Elfa calls
# (about 5 credits each; the free tier fails closed and never bills). The schedule below runs 4 news
# hunts a day (one with papers, three news-only), so at most 8 Elfa calls, about 40 credits, a day.
#
# Model cost. All model calls in one hunt share a hard cap of 20. The 01:17 run makes 0-12 NEAR calls
# (1 paper scoring + up to 5 papers, each with at most 1 repair + 1 combine) and 0-11 Muse calls for
# news (1 scoring + up to 5 items with at most 1 repair). The 3 news-only runs make 0-11 Muse calls
# each and 0 NEAR calls. Measured on 2026-11-11: about $0.0015 per glm-5.3-flash call at NEAR's listed
# prices (0.08 / 0.50 USD per million tokens in / out), so at most about $0.02 of NEAR AI a day (about
# $0.60 a month); a day with no new papers costs $0. Muse usage is unchanged for news.
#
# Schedule, chosen to be quick without wasting runs:
#   01:17 UTC  papers + news. arXiv releases new papers at 20:00 US Eastern: 01:00 UTC in winter,
#              00:00 UTC in summer, so this run is the first one after each release.
#   07:17, 13:17, 19:17 UTC  news only (posts arrive all day; papers do not). A news-only run with
#              no new news item makes no model call and does not start the canary's sandboxes. All logic is in tools/hunter/ci-steps.sh
# (tools/hunter/ci-local.sh runs the same steps locally and fails if this file drifts).
name: paper-hunt

on:
  # Path A: the workflow stays DISABLED on GitHub. The owner enables it for one watched manual
  # workflow_dispatch run, then disables it again, so these schedule lines do not fire. They are kept so
  # the daily plan is written down in one place; they only run if the workflow is left enabled.
  schedule:
    - cron: "17 1 * * *"    # papers + news, just after arXiv's daily release
    - cron: "17 7 * * *"    # news only
    - cron: "17 13 * * *"   # news only
    - cron: "17 19 * * *"   # news only
  workflow_dispatch:
    inputs:
      days:
        description: "Papers from the last N days (1-365)"
        default: "7"
      max_papers:
        description: "At most N papers (1-5)"
        default: "5"
      paper:
        description: "Optional: attack this one arXiv id (e.g. 2104.08638)"
        default: ""
      source:
        description: "papers, news or all"
        default: "all"

permissions:
  contents: read

concurrency:  # one hunt at a time: a second run waits for the first instead of overlapping it
  group: paper-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    environment: hunt   # the keys live in this Environment; the owner limits it to the main branch
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache Rust builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
            harness/target
          key: rust-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'harness/Cargo.lock', 'contracts/guard/src/**', 'contracts/test-token/src/**', 'harness/src/**') }}

      - name: Restore the used-paper list
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evidence/hunts/used-papers.json
          key: used-papers-${{ github.run_id }}
          restore-keys: used-papers-

      - name: Build
        run: bash tools/hunter/ci-steps.sh build

      - name: Self-checks
        run: bash tools/hunter/ci-steps.sh test

      - name: Hunt
        env:
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}   # papers job (NEAR AI Cloud, attested)
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}       # news job; missing = news skipped
          ELFA_API_KEY: ${{ secrets.ELFA_API_KEY }}   # optional; missing = news skipped
          # Inputs go through env, never pasted into the script; ci-steps.sh validates each.
          HUNT_DAYS: ${{ inputs.days || '7' }}
          HUNT_MAX_PAPERS: ${{ inputs.max_papers || '5' }}
          HUNT_PAPER: ${{ inputs.paper || '' }}
          # A scheduled run picks its source from its cron line; a manual run uses its input.
          HUNT_SOURCE: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 1 * * *' && 'all' || 'news') || inputs.source || 'all' }}
          HUNT_JOBS: "4"
        run: bash tools/hunter/ci-steps.sh hunt

      - name: Collect
        if: always()
        env:
          HUNT_ARTIFACT_DIR: hunt-artifact
        run: bash tools/hunter/ci-steps.sh collect

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hunt-${{ github.run_id }}
          path: hunt-artifact/
          retention-days: 30
          if-no-files-found: warn
