<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Before You Pay</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4;
    --held: #166534; --held-bg: #f0fdf4; --broke: #991b1b; --broke-bg: #fef2f2;
    --unclear: #92400e; --unclear-bg: #fffbeb; --none: #44403c; --none-bg: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --card: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524;
      --held: #86efac; --held-bg: #052e16; --broke: #fca5a5; --broke-bg: #450a0a;
      --unclear: #fcd34d; --unclear-bg: #451a03; --none: #d6d3d1; --none-bg: #292524;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --card: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524;
    --held: #86efac; --held-bg: #052e16; --broke: #fca5a5; --broke-bg: #450a0a;
    --unclear: #fcd34d; --unclear-bg: #451a03; --none: #d6d3d1; --none-bg: #292524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 260px; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  button { padding: 10px 16px; font: inherit; border: 1px solid var(--ink); border-radius: 8px; background: var(--ink); color: var(--bg); cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .examples { margin: 8px 0 24px; font-size: .9rem; color: var(--muted); }
  .examples button.ex { padding: 0; margin-right: 12px; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .badge { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 10px; }
  .s-held { color: var(--held); background: var(--held-bg); }
  .s-broke { color: var(--broke); background: var(--broke-bg); }
  .s-unclear_setting, .s-error { color: var(--unclear); background: var(--unclear-bg); }
  .s-no_record, .s-no_contract, .s-no_account, .s-bad_input { color: var(--none); background: var(--none-bg); }
  .sentence { font-size: 1.1rem; margin: 0 0 6px; }
  .caveat { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
  .offline { font-size: .85rem; color: var(--unclear); margin: 0 0 12px; }
  ul.receipts { list-style: none; padding: 0; margin: 0; }
  ul.receipts li { border-top: 1px solid var(--line); padding: 10px 0; font-size: .9rem; overflow-wrap: anywhere; }
  ul.receipts li.off { color: var(--muted); }
  .meta, .notes { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .notes p { margin: 6px 0 0; }
  code { font-size: .85em; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Check before you pay</h1>
  <p class="lede">Type a guard's account on NEAR testnet. This page asks the chain which code the account runs and whether Arena has published a test result for that code in the mode the guard reports.</p>

  <form id="f">
    <input id="acct" autocomplete="off" spellcheck="false" placeholder="guard account, e.g. r11cfx4-guard.arena-race-funder-1111.testnet" aria-label="Guard account id">
    <button type="submit">Check</button>
  </form>
  <div class="examples">Try:
    <button type="button" class="ex" data-acct="r11cfx4-guard.arena-race-funder-1111.testnet">fixed guard</button>
    <button type="button" class="ex" data-acct="r11bvf3-guard.arena-race-funder-1111.testnet">planted-flaw guard</button>
    <button type="button" class="ex" data-acct="r11cfx4-token.arena-race-funder-1111.testnet">a token (no record)</button>
  </div>

  <section id="out" aria-live="polite"></section>
</main>

<script type="module">
const out = document.getElementById("out");
const input = document.getElementById("acct");
const bundled = JSON.parse(document.getElementById("bundled-example").textContent);

const LABEL = {
  held: "Held", broke: "Broke", unclear_setting: "Don't rely on it", no_record: "No Arena record",
  no_contract: "No contract", no_account: "No such account", error: "Lookup failed", bad_input: "Not an account id",
};

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
function link(href, text) { return el("a", { href, target: "_blank", rel: "noopener" }, text); }

function render(a, offlineNote) {
  out.replaceChildren();
  const card = el("div", { class: "card" });
  if (offlineNote) card.append(el("p", { class: "offline" }, offlineNote));
  card.append(el("span", { class: `badge s-${a.status}` }, LABEL[a.status] || a.status));
  card.append(el("p", { class: "sentence" }, a.sentence));
  card.append(el("p", { class: "caveat" }, a.caveat));
  const meta = [`Account ${a.account}`];
  if (a.code_hash) meta.push(`code sha256 ${a.code_hash.slice(0, 12)}…`);
  if (a.mode_read) meta.push(a.mode_read === "ok" ? `mode ${a.mode}` : a.mode_read === "no_get_mode" ? "no get_mode()" : "mode unreadable");
  if (a.block) meta.push(`read at block ${a.block.height}`);
  card.append(el("p", { class: "meta" }, meta.join(" · ")));
  if (a.receipts.length) {
    const ul = el("ul", { class: "receipts" });
    for (const d of a.receipts) {
      const li = el("li", { class: d.counted ? "" : "off" });
      if (!d.counted) li.append(el("strong", {}, "Does not apply to this guard: "));
      li.append(el(d.counted ? "strong" : "span", {}, `${d.test}: ${d.result}`), ` (${d.tests_held} of ${d.tests_run} held, ${d.beyond_policy} over the limit). `);
      li.append(d.counted ? "Counted in the answer. " : `Not counted: ${d.not_counted_because}. `);
      li.append(el("br"), `Published ${d.published_date} · `, link(d.publish_tx_url, d.publish_tx ? "publish tx" : "receipts contract"), " · evidence ",
        el("code", {}, d.evidence_path), ` sha256 ${d.evidence_sha256.slice(0, 12)}…`);
      ul.append(li);
    }
    card.append(ul);
  }
  if (a.notes.length) {
    const n = el("div", { class: "notes" });
    for (const t of a.notes) n.append(el("p", {}, t));
    card.append(n);
  }
  out.append(card);
}

function showBundled(account, why) {
  const ex = bundled.find((a) => a.account === account);
  if (!ex) {
    // Never show another account's saved answer: with no live lookup, this account gets no answer at all.
    return render({ account, status: "error", sentence: "No live lookup is available here, and there is no saved example for this account. There is no answer, so treat the guard as unchecked.",
      caveat: bundled[0].caveat, code_hash: null, mode_read: null, block: null, receipts: [], notes: [] }, why);
  }
  render(ex, `${why} Showing a saved example from ${ex.block ? `block ${ex.block.height}` : "an earlier run"}, not a live answer.`);
}

let lib = null;
try { lib = await import("./arena-lookup.mjs"); } catch { lib = null; }

async function check(account) {
  account = account.trim();
  if (!account) return;
  if (!lib) return showBundled(account, "The live lookup could not load here (opened as a file, or the module is missing).");
  out.replaceChildren(el("p", { class: "meta" }, "Checking testnet…"));
  const a = await lib.lookup(account);
  if (a.status === "error" && bundled.some((b) => b.account === account)) {
    return showBundled(account, `No network answer (${a.error}).`);
  }
  render(a);
}

document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); check(input.value); });
for (const a of document.querySelectorAll("[data-acct]")) {
  a.addEventListener("click", () => { input.value = a.dataset.acct; check(a.dataset.acct); });
}
if (!lib) showBundled(bundled[0].account, "The live lookup could not load here (opened as a file, or the module is missing).");
</script>
